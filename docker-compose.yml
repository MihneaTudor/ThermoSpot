services:
    database:
        build:
            context: ./database
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        ports:
            - "${MYSQL_PORT}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 20

    backend:
        build:
            context: ./backend
        environment:
            DB_HOST: database
            MYSQL_PORT: 3306
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set in .env}
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        depends_on:
            database:
                condition: service_healthy
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
        environment:
            VITE_API_URL: http://localhost:8000
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "5173:5173"
        depends_on:
            - backend
        restart: unless-stopped

volumes:
    mysql_data: