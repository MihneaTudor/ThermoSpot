apiVersion: v1
kind: Service
metadata:
  name: thermospot-database-headless
spec:
  clusterIP: None
  selector:
    app: thermospot-database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: thermospot-database
spec:
  type: ClusterIP
  selector:
    app: thermospot-database
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thermospot-database
spec:
  serviceName: thermospot-database-headless
  replicas: 1
  selector:
    matchLabels:
      app: thermospot-database
  template:
    metadata:
      labels:
        app: thermospot-database
    spec:
      containers:
        - name: database
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: thermospot-db-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: thermospot-db-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thermospot-db-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thermospot-db-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
